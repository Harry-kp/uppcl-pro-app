name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste your account number, phone number, name, address or password.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: |
        On the error, tap **Details → Copy details** and paste it here. It says which system failed
        (UPPCL SMART, bill portal, 1912 portal, or the app) and UPPCL's own message.
      render: text
  - type: dropdown
    id: official
    attributes:
      label: Does the same thing work in the official UPPCL SMART app or website?
      description: If it fails there too, it's UPPCL's side and only they can fix it.
      options: ["Yes, it works there", "No, it fails there too", "Didn't check"]
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Account type
      options: [Prepaid, Postpaid, Not sure]
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, or the APK name (e.g. v0.1.0)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: e.g. Redmi Note 12, Android 14
    validations:
      required: true
