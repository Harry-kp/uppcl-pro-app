name: Release APK
# Push a tag vX.Y.Z (must match app.json "version"). Re-pushing the same tag, or re-running this
# workflow, rebuilds and overwrites the APK on the same GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches app.json version
        run: |
          v=$(jq -r .expo.version app.json)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG != app.json version v$v"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: scripts/scan-pii.sh
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}

      - name: Prebuild android/
        run: bunx expo prebuild --platform android --no-install

      - name: Sign release builds with the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          release_cfg = """signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }"""
          assert s.count("signingConfigs {") == 1
          s = s.replace("signingConfigs {", release_cfg, 1)
          i = s.index("release {", s.index("buildTypes {"))
          j = s.index("signingConfig signingConfigs.debug", i)
          s = s[:j] + "signingConfig signingConfigs.release" + s[j + len("signingConfig signingConfigs.debug"):]
          open(p, "w").write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle

      - name: assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # ARM only: every Android phone in use; x86 is emulators and doubles size + build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Porg.gradle.jvmargs=-Xmx4g

      - name: Verify signature and package
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then echo "signed with the debug key"; exit 1; fi
          out="meter-pro-$TAG.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Android APK: download \`meter-pro-$TAG.apk\`, allow installs from your browser/Files app, install. SHA-256 in \`meter-pro-$TAG.apk.sha256\`.

          This APK may be rebuilt and replaced under the same version while it stabilises. The in-app update check only offers a *newer version number*, so a rebuilt APK of the same version is not offered automatically: reinstall it from here."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Meter Pro $TAG" --notes "$notes" --generate-notes --verify-tag
          gh release upload "$TAG" "meter-pro-$TAG.apk" "meter-pro-$TAG.apk.sha256" --clobber
